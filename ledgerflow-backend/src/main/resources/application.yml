spring:
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgerflow}
    username: ${DB_USERNAME:ledgerflow}
    password: ${DB_PASSWORD:ledgerflow}
  jpa:
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
frankfurter:
  base-url: ${FRANKFURTER_BASE_URL:https://api.frankfurter.dev}
settlement:
  input-directory: ${SETTLEMENT_INPUT_DIRECTORY:${java.io.tmpdir}/ledgerflow/settlements/input}
  error-directory: ${SETTLEMENT_ERROR_DIRECTORY:${java.io.tmpdir}/ledgerflow/settlements/errors}
