databaseChangeLog:
  - changeSet:
      id: 002-create-settlement-transactions
      author: Facundo D'Alessio
      changes:
        - createTable:
            tableName: settlement_transactions
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: external_transaction_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: source_account
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: destination_account
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: DECIMAL(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: CHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: fee_amount
                  type: DECIMAL(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: transaction_timestamp
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: merchant_code
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: amount_usd
                  type: DECIMAL(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: fee_usd
                  type: DECIMAL(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: state
                  type: VARCHAR(24)
                  constraints:
                    nullable: false
